<style>

  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Jost", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 420px; margin: 0 auto; min-height: 100vh; padding: 64px 16px 32px; text-align: center; }

  .brand span { color: var(--gold); }

  p { color: var(--muted); margin: 0 0 24px; }
  input[type=password] { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--card); font: inherit; color: var(--ink); text-align: center; }
  input[type=password]:focus { outline: none; border-color: var(--gold); }
  button { width: 100%; min-height: 52px; margin-top: 12px; border: none; border-radius: 14px;
    background: var(--ink); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  label { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 14px;
    font-size: 15px; color: var(--muted); }
  label input { width: 18px; height: 18px; accent-color: var(--gold); }
  .err { color: #a2463a; min-height: 24px; margin-top: 12px; font-size: 15px; }
  .lang { position: absolute; top: 20px; right: 16px; display: flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { width: auto; min-height: 0; margin: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 4px 10px; }
  .lang button.on { background: var(--ink); color: #fff; }
  .wrap { position: relative; }
</style>

const ITERATIONS = 310000;
const KEY = 'allieluxe-questions-pw';
const LANG_KEY = 'allieluxe-lang';
let lang = 'en';
try { if (localStorage.getItem(LANG_KEY) === 'ru') lang = 'ru'; } catch (e) {}
const MSG = { en: { opening: 'Opening…', wrong: "That password didn't work. Please try again." },
              ru: { opening: 'Открываю…', wrong: 'Пароль не подошёл. Попробуй ещё раз.' } };
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-en]').forEach(n => { n.textContent = n.dataset[lang]; });
  const pw = document.getElementById('pw'); pw.placeholder = lang === 'ru' ? pw.dataset.phRu : pw.dataset.phEn;
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  applyLang();
}));
applyLang();
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: ITERATIONS, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

async function tryOpen(password, remember) {
  try {
    const html = await unlock(password);
    try { remember ? localStorage.setItem(KEY, password) : localStorage.removeItem(KEY); } catch (e) {}
    show(html);
    return true;
  } catch (e) {
    return false;
  }
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err');
  err.textContent = MSG[lang].opening;
  const ok = await tryOpen(document.getElementById('pw').value.trim(), document.getElementById('remember').checked);
  if (!ok) err.textContent = MSG[lang].wrong;
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && !(await tryOpen(saved, true))) {
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
})();
})();
